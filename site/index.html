<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClearYear</title>
<meta name="description" content="ClearYear ranks every 2027 Florida marketplace plan by what your household would really pay for the year: premium after the tax credit plus your share of care. Free, and nothing you type is saved.">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

      <b>ClearYear</b>
      <span class="chip">Florida · 2027 plans</span>
    </button>
    <div id="mode-chip"></div>
  </div>
</header>
<div id="progress"></div>
<main id="app" class="screen wrap" aria-live="polite"></main>
